# CloudTasks: nginx (public, port 80) -> app (internal network only) -> SQLite on a named volume.
name: cloudtasks

services:
  app:
    build:
      context: .
      target: runtime
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
    image: cloudtasks-app:${APP_VERSION:-1.0.0}
    container_name: cloudtasks-app
    restart: always
    read_only: true                       # whole filesystem read-only...
    tmpfs:
      - /tmp:size=16m
    volumes:
      - taskdata:/data                    # ...except the database volume
    environment:
      CONTAINER_NAME: cloudtasks-app
      DEPLOY_TIME: ${DEPLOY_TIME:-}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-300}
      MAX_TASKS: ${MAX_TASKS:-300}
      TRUSTED_PROXIES: 172.28.0.10/32     # only nginx may set X-Real-IP / X-Forwarded-For
      # Filled from the Azure metadata service on the VM host by the deploy script (not secrets).
      AZURE_REGION: ${AZURE_REGION:-}
      AZURE_VM_SIZE: ${AZURE_VM_SIZE:-}
      AZURE_VM_NAME: ${AZURE_VM_NAME:-}
      AZURE_PUBLIC_IP: ${AZURE_PUBLIC_IP:-}
    networks:
      - backend                           # no ports published: unreachable from outside
    mem_limit: 256m
    cpus: 0.75
    pids_limit: 100
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging: &logging
      driver: json-file
      options: { max-size: "5m", max-file: "3" }

  nginx:
    image: nginx:1.30-alpine
    container_name: cloudtasks-nginx
    restart: always
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
      - /tmp:size=8m
    networks:
      frontend: {}
      backend:
        ipv4_address: 172.28.0.10         # fixed, so the app can trust exactly this address
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 50
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]   # bind :80 and drop to the nginx user
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging: *logging

networks:
  frontend: {}                            # nginx <-> outside world
  backend:
    internal: true                        # app <-> nginx only, no route to the internet
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  taskdata: {}
