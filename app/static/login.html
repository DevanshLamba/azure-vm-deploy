<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign in · CloudTasks</title>
  <meta name="description" content="Sign in to CloudTasks, an invite-only task board on Azure.">
  <meta name="theme-color" content="#FBF7F2">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/static/fonts/fredoka.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/nunito.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/theme.js"></script>
  <script src="/static/login.js" defer></script>
</head>
<body class="login-body">
  <svg width="0" height="0" class="sr-only" aria-hidden="true">
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M12 2.8v2M12 19.2v2M2.8 12h2M19.2 12h2M5.5 5.5l1.4 1.4M17.1 17.1l1.4 1.4M5.5 18.5l1.4-1.4M17.1 6.9l1.4-1.4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.6A7.8 7.8 0 0 1 9.4 4.5a7.8 7.8 0 1 0 10.1 10.1Z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M4 4l16 16M10.6 6.1A9.6 9.6 0 0 1 12 6c6 0 9.5 6 9.5 6a17 17 0 0 1-3 3.6M6.3 7.6A16.5 16.5 0 0 0 2.5 12S6 18 12 18a9 9 0 0 0 4.3-1.1M9.9 9.9a3 3 0 0 0 4.2 4.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <header class="login-top">
    <a class="brand" href="/login" aria-label="CloudTasks">
      <svg class="brand-logo" viewBox="0 0 48 48" aria-hidden="true">
        <defs><linearGradient id="logo-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC9AE"/><stop offset=".55" stop-color="#F7B4CB"/><stop offset="1" stop-color="#C9B8F5"/></linearGradient></defs>
        <path d="M14 37a9 9 0 0 1-1.3-17.9A12 12 0 0 1 35.6 17 10 10 0 0 1 35 37Z" fill="url(#logo-g)"/>
        <path d="m18 27 4.2 4.2L31 22.5" fill="none" stroke="#3B3442" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-name">CloudTasks</span>
    </a>
    <button class="icon-btn theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark theme">
      <svg class="i-moon" aria-hidden="true"><use href="#i-moon"/></svg>
      <svg class="i-sun" aria-hidden="true"><use href="#i-sun"/></svg>
    </button>
  </header>

  <main class="login-main" id="main">
    <span class="login-blob login-blob-1" aria-hidden="true"></span>
    <span class="login-blob login-blob-2" aria-hidden="true"></span>
    <span class="login-blob login-blob-3" aria-hidden="true"></span>

    <section class="login-card" aria-labelledby="login-title">
      <svg class="login-art" viewBox="0 0 220 120" aria-hidden="true">
        <ellipse cx="110" cy="110" rx="70" ry="7" class="art-shadow"/>
        <g class="art-bob">
          <path d="M70 92a22 22 0 0 1-1.8-43.9A29 29 0 0 1 124 42a24 24 0 0 1-1 50Z" class="art-cloud"/>
          <ellipse cx="84" cy="70" rx="3" ry="3.9" class="art-eye"/>
          <ellipse cx="106" cy="70" rx="3" ry="3.9" class="art-eye"/>
          <path d="M89.5 78q5.5 5 11 0" class="art-smile"/>
          <ellipse cx="77" cy="79" rx="5.5" ry="3.2" class="art-cheek"/>
          <ellipse cx="113" cy="79" rx="5.5" ry="3.2" class="art-cheek"/>
        </g>
        <g class="art-float">
          <circle cx="152" cy="52" r="15" class="art-key-ring"/>
          <circle cx="152" cy="52" r="6" class="art-key-hole"/>
          <path d="M165 60l22 13M178 68l-4 7M184 72l-4 7" class="art-key-bit"/>
        </g>
        <path d="M40 30c.7 4.6 2.4 6.4 7 7-4.6.7-6.3 2.5-7 7.1-.7-4.6-2.4-6.4-7-7 4.6-.7 6.3-2.5 7-7.1Z" class="art-spark-2"/>
        <path d="M188 18c.8 5 2.7 7 7.6 7.7-4.9.7-6.8 2.7-7.6 7.7-.8-5-2.7-7-7.6-7.7 4.9-.7 6.8-2.7 7.6-7.7Z" class="art-spark-1"/>
      </svg>

      <h1 id="login-title" class="login-title">Welcome back</h1>
      <p class="login-sub">CloudTasks is invite-only. Sign in with the account Devansh gave you.</p>

      <noscript><p class="form-error">Please enable JavaScript to sign in.</p></noscript>

      <form id="login-form" class="login-form" novalidate>
        <div class="login-field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none"
                 spellcheck="false" maxlength="64" required>
        </div>
        <div class="login-field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password"
                   maxlength="128" required aria-describedby="caps-hint">
            <button type="button" class="icon-btn icon-btn-sm reveal" id="reveal" aria-label="Show password" aria-pressed="false">
              <svg class="i-eye" aria-hidden="true"><use href="#i-eye"/></svg>
              <svg class="i-eye-off" aria-hidden="true"><use href="#i-eye-off"/></svg>
            </button>
          </div>
          <p class="caps-hint" id="caps-hint" hidden>Caps Lock is on.</p>
        </div>

        <p class="form-error" id="login-error" role="alert" hidden></p>

        <button class="btn btn-primary login-submit" type="submit" id="login-submit">Sign in</button>
      </form>

      <p class="login-foot">Here from the portfolio? Use the demo login shown there. It's read-only, so look around freely.</p>
    </section>
  </main>
</body>
</html>
